name: Provision Student Repositories

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  provision:
    if: github.event.label.name == 'provision-repo'
    runs-on: ubuntu-latest

    env:
      ORG_NAME: FS3DContentCreation
      EXPECTED_HASH: ad6ef0ee6945bf78405312c97181b25466d08165ee1be4c104b960b27be37c4f

    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.ORG_NAME }}

      - name: Parse Issue Body and Authenticate Student
        id: auth
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STUDENT_GITHUB_LOGIN: ${{ github.event.issue.user.login }}
          HASHDB: ${{ vars.HASHDB }}
        run: |
          echo "Parsing issue form data..."

          STUDENT_EMAIL=$(printf '%s\n' "$ISSUE_BODY" | grep -A 2 -i "Full Sail Email" | tail -n 1 | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          PASSCODE=$(printf '%s\n' "$ISSUE_BODY" | grep -A 2 -i "Passcode" | tail -n 1 | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

          if [ -z "$STUDENT_EMAIL" ] || [ -z "$PASSCODE" ]; then
            echo "ERROR: Student email or passcode missing from issue body."
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@${STUDENT_GITHUB_LOGIN} Error: Email or passcode was not provided. Please follow the issue template."
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not_planned"
            echo "AUTH_FAILED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          PASSCODE_HASH=$(printf '%s' "$PASSCODE" | sha256sum | awk '{print $1}')
          if [ "$PASSCODE_HASH" != "$EXPECTED_HASH" ]; then
            echo "ERROR: Invalid passcode."
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@${STUDENT_GITHUB_LOGIN} Error: Invalid enrollment passcode provided."
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not_planned"
            echo "AUTH_FAILED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          NORMALIZED_EMAIL=$(printf '%s' "$STUDENT_EMAIL" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')
          STUDENT_HASH=$(printf '%s' "$NORMALIZED_EMAIL" | sha256sum | awk '{print $1}')
          MATCH_LINE=$(printf '%s\n' "$HASHDB" | grep -m 1 -E "^${STUDENT_HASH}[[:space:]]" || true)

          if [ -z "$MATCH_LINE" ]; then
            echo "ERROR: Student email not found in authorized roster (HASHDB)."
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@${STUDENT_GITHUB_LOGIN} Error: Your email (${STUDENT_EMAIL}) is not listed in the authorized student roster."
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not_planned"
            echo "AUTH_FAILED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          REPO_TAG=$(printf '%s\n' "$MATCH_LINE" | awk '{print $2}')
          STUDENT_EMAIL_USERNAME=$(printf '%s' "$NORMALIZED_EMAIL" | awk -F '@' '{print $1}')

          echo "STUDENT_EMAIL_USERNAME=${STUDENT_EMAIL_USERNAME}" >> "$GITHUB_ENV"
          echo "REPO_TAG=${REPO_TAG}" >> "$GITHUB_ENV"
          echo "AUTH_FAILED=false" >> "$GITHUB_ENV"

      - name: Provision Course Repositories
        if: env.AUTH_FAILED == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ORG: ${{ env.ORG_NAME }}
          STUDENT_GITHUB_LOGIN: ${{ github.event.issue.user.login }}
          STUDENT_EMAIL_USERNAME: ${{ env.STUDENT_EMAIL_USERNAME }}
          REPO_TAG: ${{ env.REPO_TAG }}
        run: |
          set -e
          SUMMARY=""

          LABS="1 2 3 4 5 6 7"
          for N in $LABS; do
            TEMPLATE_REPO="3dcc-lab-${N}"
            NEW_REPO_NAME="3dcc-lab-${N}-${REPO_TAG}-${STUDENT_EMAIL_USERNAME}"

            if gh repo view "$ORG/$NEW_REPO_NAME" > /dev/null 2>&1; then
              echo "::warning::Repository $ORG/$NEW_REPO_NAME already exists. Skipping."
              SUMMARY="${SUMMARY}- https://github.com/${ORG}/${NEW_REPO_NAME} (already existed)\n"
              continue
            fi

            echo "Creating private repository $NEW_REPO_NAME from template $TEMPLATE_REPO..."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$ORG/$TEMPLATE_REPO/generate" \
              -f owner="$ORG" \
              -f name="$NEW_REPO_NAME" \
              -F private=true

            for i in $(seq 1 15); do
              BRANCH_CHECK=$(gh api "/repos/$ORG/$NEW_REPO_NAME/branches" --jq '.[].name' 2>/dev/null || true)
              if [ -n "$BRANCH_CHECK" ]; then
                echo "Repository files and branches initialized successfully!"
                break
              fi
              echo "Template copy in progress... waiting 3 seconds (Attempt $i/15)"
              sleep 3
            done
            sleep 5

            echo "Adding student $STUDENT_GITHUB_LOGIN as a collaborator..."
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/repos/$ORG/$NEW_REPO_NAME/collaborators/$STUDENT_GITHUB_LOGIN" \
              -f permission=write

            echo "Setting topics..."
            gh repo edit "$ORG/$NEW_REPO_NAME" --add-topic "ops-student"
            gh repo edit "$ORG/$NEW_REPO_NAME" --add-topic "not-graded"

            SUMMARY="${SUMMARY}- https://github.com/${ORG}/${NEW_REPO_NAME}\n"
          done

          EXTRA_TEMPLATES="renderdoc API_SAMPLES"
          for EXTRA in $EXTRA_TEMPLATES; do
            EXTRA_NEW_NAME="${EXTRA}-${REPO_TAG}-${STUDENT_EMAIL_USERNAME}"

            if gh repo view "$ORG/$EXTRA_NEW_NAME" > /dev/null 2>&1; then
              echo "::warning::Repository $ORG/$EXTRA_NEW_NAME already exists. Skipping."
              SUMMARY="${SUMMARY}- https://github.com/${ORG}/${EXTRA_NEW_NAME} (already existed)\n"
              continue
            fi

            echo "Creating private repository $EXTRA_NEW_NAME from template $EXTRA..."
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$ORG/$EXTRA/generate" \
              -f owner="$ORG" \
              -f name="$EXTRA_NEW_NAME" \
              -F private=true

            for i in $(seq 1 15); do
              BRANCH_CHECK=$(gh api "/repos/$ORG/$EXTRA_NEW_NAME/branches" --jq '.[].name' 2>/dev/null || true)
              if [ -n "$BRANCH_CHECK" ]; then
                echo "Repository branches initialized successfully!"
                break
              fi
              echo "Template copy in progress... waiting 3 seconds (Attempt $i/15)"
              sleep 3
            done
            sleep 5

            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/repos/$ORG/$EXTRA_NEW_NAME/collaborators/$STUDENT_GITHUB_LOGIN" \
              -f permission=write

            gh repo edit "$ORG/$EXTRA_NEW_NAME" --add-topic "ops-student"
            gh repo edit "$ORG/$EXTRA_NEW_NAME" --add-topic "not-graded"

            SUMMARY="${SUMMARY}- https://github.com/${ORG}/${EXTRA_NEW_NAME}\n"
          done

          {
            echo 'PROVISION_SUMMARY<<EOF'
            printf '%b' "$SUMMARY"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Close Issue and Reply to Student
        if: env.AUTH_FAILED == 'false'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STUDENT_GITHUB_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "@${STUDENT_GITHUB_LOGIN}, your private lab repositories have been configured:

          ${PROVISION_SUMMARY}

          **IMPORTANT**: Save this list for your records.
          **ACTION REQUIRED**: You will receive a separate repository invitation for each lab repository above. You must accept each invitation within **7 days**, or it will expire. Accept them now and clone the repositories to verify that they work."

          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --reason "completed"
